<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ôn tập Tiếng Anh 12 · Unit 2 &amp; 3</title>
  <meta name="description" content="Ôn tập trắc nghiệm Tiếng Anh 12 Unit 2 và Unit 3 với chế độ tổng hợp ngẫu nhiên, xáo trộn câu hỏi và đáp án." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b14;
      --surface: rgba(255, 255, 255, 0.045);
      --surface-2: rgba(255, 255, 255, 0.075);
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text: #eef2ff;
      --muted: #9aa6c4;
      --dim: #6b7897;
      --indigo: #8b9cff;
      --teal: #57e0c4;
      --coral: #ff8f8f;
      --amber: #ffd479;
      --green: #4ade80;
      --red: #fb7185;
      --grad: linear-gradient(135deg, #8b9cff 0%, #57e0c4 100%);
      --shadow: 0 26px 80px -28px rgba(0, 0, 0, 0.9);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 620px at 10% -10%, rgba(139, 156, 255, 0.18), transparent 60%),
        radial-gradient(760px 580px at 100% 8%, rgba(87, 224, 196, 0.12), transparent 58%),
        radial-gradient(720px 720px at 52% 118%, rgba(255, 143, 143, 0.08), transparent 62%),
        linear-gradient(180deg, #070b14 0%, #0a1020 52%, #070b14 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.024) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.024) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 10%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 10%, transparent 80%);
    }
    img, svg { display: block; }
    button { font-family: inherit; }
    ::selection { background: rgba(139, 156, 255, 0.35); color: #fff; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #070b14; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 99px; }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

    .orb {
      position: fixed;
      z-index: 0;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      opacity: 0.5;
      animation: orbFloat 20s ease-in-out infinite;
    }
    .orb-1 { width: 380px; height: 380px; top: -160px; left: -120px; background: rgba(139, 156, 255, 0.4); }
    .orb-2 { width: 320px; height: 320px; bottom: -140px; right: -100px; background: rgba(87, 224, 196, 0.3); animation-delay: -7s; }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, 24px) scale(1.08); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: 28px 20px 64px;
    }

    /* ---------- Top bar ---------- */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 44px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
      background: var(--grad); color: #061018; font-weight: 800; font-size: 19px;
      box-shadow: 0 10px 28px -10px rgba(87, 224, 196, 0.55); flex-shrink: 0;
    }
    .brand-name { display: block; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
    .brand-sub { display: block; margin-top: 2px; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .topbar-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px;
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.035);
      color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    .topbar-pill b { color: var(--text); font-weight: 700; }
    .topbar-pill svg { color: var(--teal); }

    /* ---------- Hero ---------- */
    .hero { text-align: center; margin-bottom: 36px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal);
    }
    .hero h1 {
      margin: 16px 0 14px; font-family: "Lora", Georgia, serif; font-weight: 600;
      font-size: clamp(36px, 6vw, 58px); line-height: 1.06; letter-spacing: -0.035em;
    }
    .hero h1 em {
      font-style: italic; font-weight: 600;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p { max-width: 640px; margin: 0 auto; color: var(--muted); font-size: 15px; line-height: 1.75; }
    .hero-stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin-top: 24px; }
    .hero-stat {
      display: inline-flex; align-items: baseline; gap: 6px; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03);
      color: var(--muted); font-size: 12px; font-weight: 500;
    }
    .hero-stat b { font-size: 15px; font-weight: 800; color: var(--text); }

    /* ---------- Random card ---------- */
    .random-card {
      position: relative; margin-bottom: 34px; padding: 1.5px; border-radius: 28px;
      background: linear-gradient(135deg, rgba(139, 156, 255, 0.8), rgba(87, 224, 196, 0.3) 52%, rgba(255, 143, 143, 0.45));
      box-shadow: 0 30px 80px -40px rgba(87, 224, 196, 0.5);
    }
    .random-inner {
      position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center; gap: 22px; padding: 26px 28px; border-radius: 26.5px;
      background: linear-gradient(135deg, rgba(13, 20, 37, 0.99), rgba(9, 15, 29, 0.99));
      overflow: hidden;
    }
    .random-inner::after {
      content: ""; position: absolute; top: -150px; right: -70px; width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(139, 156, 255, 0.2), transparent 66%); pointer-events: none;
    }
    .random-icon {
      width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
      background: var(--grad); color: #061018; flex-shrink: 0;
      box-shadow: 0 16px 36px -14px rgba(87, 224, 196, 0.6);
    }
    .random-title { margin: 0 0 7px; font-size: 22px; font-weight: 800; letter-spacing: -0.025em; }
    .random-desc { margin: 0; max-width: 550px; color: var(--muted); font-size: 13.5px; line-height: 1.65; }
    .random-side { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
    .seg { display: flex; gap: 2px; padding: 4px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255, 255, 255, 0.05); }
    .seg button {
      border: 0; padding: 7px 10px; border-radius: 9px; background: transparent; color: var(--muted);
      font-size: 11.5px; font-weight: 700; cursor: pointer; transition: 0.2s ease; white-space: nowrap;
    }
    .seg button:hover { color: var(--text); }
    .seg button.active { background: rgba(139, 156, 255, 0.2); color: var(--text); box-shadow: inset 0 0 0 1px rgba(139, 156, 255, 0.35); }

    /* ---------- Buttons ---------- */
    .btn {
      appearance: none; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 20px; border-radius: 14px; font-size: 13.5px; font-weight: 700; line-height: 1;
      cursor: pointer; white-space: nowrap; transition: transform 0.2s ease, filter 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .btn svg { flex-shrink: 0; }
    .btn-primary { background: var(--grad); color: #061018; box-shadow: 0 14px 34px -14px rgba(87, 224, 196, 0.55); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
    .btn-ghost { background: rgba(255, 255, 255, 0.045); border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.085); border-color: var(--border-strong); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    .icon-btn {
      width: 42px; height: 42px; flex-shrink: 0; display: grid; place-items: center; border-radius: 14px;
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04); color: var(--muted);
      cursor: pointer; transition: 0.2s ease;
    }
    .icon-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); border-color: var(--border-strong); }

    /* ---------- Sections ---------- */
    .group { margin-bottom: 30px; }
    .group-head { display: flex; align-items: baseline; gap: 12px; margin: 0 4px 14px; }
    .group-unit { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--teal); white-space: nowrap; }
    .group-title { margin: 0; font-family: "Lora", Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
    .group-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
    .section-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    .section-grid.single { grid-template-columns: 1fr; }
    .section-card {
      position: relative; display: flex; align-items: center; gap: 15px; width: 100%; padding: 17px 18px;
      border: 1px solid var(--border); border-radius: 20px; background: var(--surface);
      color: inherit; text-align: left; cursor: pointer; overflow: hidden;
      transition: transform 0.24s ease, background 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease;
    }
    .section-card::before {
      content: ""; position: absolute; top: 14px; bottom: 14px; left: 0; width: 3px;
      border-radius: 0 4px 4px 0; background: var(--accent); opacity: 0.75;
    }
    .section-card:hover {
      transform: translateY(-3px); background: var(--surface-2); border-color: var(--border-strong);
      box-shadow: 0 20px 44px -28px var(--accent);
    }
    .section-icon {
      width: 46px; height: 46px; flex-shrink: 0; display: grid; place-items: center; border-radius: 14px;
      color: var(--accent); border: 1px solid var(--border);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .section-info { display: flex; flex-direction: column; min-width: 0; }
    .section-kicker { font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
    .section-title { margin: 3px 0; font-size: 16.5px; font-weight: 700; letter-spacing: -0.015em; }
    .section-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
    .section-go {
      width: 31px; height: 31px; flex-shrink: 0; margin-left: auto; display: grid; place-items: center;
      border-radius: 50%; border: 1px solid var(--border); color: var(--muted); transition: 0.22s ease;
    }
    .section-card:hover .section-go { background: var(--accent); border-color: transparent; color: #061018; transform: translateX(2px); }

    /* ---------- Settings ---------- */
    .settings {
      display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
      margin: 34px 0 16px; padding: 17px 20px; border: 1px solid var(--border); border-radius: 20px;
      background: var(--surface);
    }
    .settings-copy h3 { margin: 0 0 3px; font-size: 13.5px; font-weight: 700; }
    .settings-copy p { margin: 0; font-size: 11.5px; color: var(--dim); line-height: 1.5; }
    .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
    .switch {
      display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: 12px;
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03);
      color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; transition: 0.2s ease;
    }
    .switch:hover { border-color: var(--border-strong); color: var(--text); }
    .switch.on { color: var(--text); border-color: rgba(139, 156, 255, 0.38); background: rgba(139, 156, 255, 0.1); }
    .switch-track { position: relative; width: 32px; height: 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); transition: 0.2s ease; flex-shrink: 0; }
    .switch.on .switch-track { background: rgba(139, 156, 255, 0.65); }
    .switch-thumb {
      position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45); transition: transform 0.2s ease;
    }
    .switch.on .switch-thumb { transform: translateX(14px); }

    .footer-note { margin: 26px auto 0; max-width: 640px; text-align: center; color: var(--dim); font-size: 11.5px; line-height: 1.75; }
    .footer-note b { color: var(--muted); font-weight: 600; }

    /* ---------- Quiz ---------- */
    .quiz-shell { width: min(860px, 100%); margin: 0 auto; }
    .quiz-top { display: flex; align-items: center; gap: 13px; margin-bottom: 18px; }
    .quiz-heading { flex: 1; min-width: 0; }
    .quiz-eyebrow {
      font-size: 10px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--teal);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .quiz-heading h1 {
      margin: 3px 0 0; font-size: 16.5px; font-weight: 700; letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .score-pill {
      display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; padding: 9px 13px;
      border-radius: 999px; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04);
      color: var(--muted); font-size: 11.5px; font-weight: 700;
    }
    .score-pill b { color: var(--green); font-weight: 800; }
    .score-pill svg { color: var(--amber); }
    .progress-wrap { height: 6px; margin-bottom: 22px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
    .progress-fill {
      height: 100%; border-radius: 99px; background: var(--grad);
      box-shadow: 0 0 14px rgba(139, 156, 255, 0.55);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .q-card {
      position: relative; padding: clamp(22px, 4vw, 36px); border: 1px solid var(--border); border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.022));
      box-shadow: var(--shadow);
    }
    .q-card.animate { animation: cardIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.992); }
      to { opacity: 1; transform: none; }
    }
    .q-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
      border: 1px solid rgba(139, 156, 255, 0.24); background: rgba(139, 156, 255, 0.12);
      color: #cbd4ff; font-size: 10.5px; font-weight: 800; letter-spacing: 0.03em;
    }
    .chip.ghost { border-color: var(--border); background: rgba(255, 255, 255, 0.04); color: var(--muted); font-weight: 600; }
    .q-text {
      margin: 0 0 24px; font-family: "Lora", Georgia, serif; font-weight: 500;
      font-size: clamp(19px, 2.35vw, 23px); line-height: 1.6; letter-spacing: -0.012em; color: #f5f8ff;
    }
    .options { display: flex; flex-direction: column; gap: 9px; }
    .option {
      display: flex; align-items: center; gap: 13px; width: 100%; padding: 13px 15px;
      border: 1px solid var(--border); border-radius: 16px; background: rgba(255, 255, 255, 0.028);
      color: var(--text); text-align: left; font-size: 15px; line-height: 1.5; cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
    }
    .option:hover:not(.locked) { background: rgba(255, 255, 255, 0.06); border-color: var(--border-strong); transform: translateX(2px); }
    .letter {
      width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; border-radius: 11px;
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.045);
      color: var(--muted); font-size: 11.5px; font-weight: 800; transition: 0.2s ease;
    }
    .opt-text { flex: 1; }
    u {
      text-decoration-line: underline;
      text-decoration-thickness: 2px;
      text-decoration-color: currentColor;
      text-underline-offset: 3px;
    }
    .opt-status { width: 20px; height: 20px; flex-shrink: 0; display: grid; place-items: center; }
    .option.selected { border-color: rgba(139, 156, 255, 0.62); background: rgba(139, 156, 255, 0.11); box-shadow: inset 0 0 0 1px rgba(139, 156, 255, 0.18); }
    .option.selected .letter { border-color: transparent; background: var(--grad); color: #061018; }
    .option.correct { border-color: rgba(74, 222, 128, 0.55); background: rgba(74, 222, 128, 0.09); }
    .option.correct .letter { border-color: rgba(74, 222, 128, 0.5); background: rgba(74, 222, 128, 0.18); color: #86efac; }
    .option.wrong { border-color: rgba(251, 113, 133, 0.55); background: rgba(251, 113, 133, 0.08); }
    .option.wrong .letter { border-color: rgba(251, 113, 133, 0.5); background: rgba(251, 113, 133, 0.16); color: #fda4af; }
    .option.locked { cursor: default; }
    .option.dim { opacity: 0.55; }

    .feedback {
      display: flex; align-items: flex-start; gap: 12px; margin-top: 21px; padding: 15px 17px;
      border: 1px solid; border-radius: 16px; animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .feedback.good { border-color: rgba(74, 222, 128, 0.3); background: rgba(74, 222, 128, 0.08); }
    .feedback.bad { border-color: rgba(251, 113, 133, 0.32); background: rgba(251, 113, 133, 0.08); }
    .fb-icon { width: 26px; height: 26px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; }
    .feedback.good .fb-icon { background: rgba(74, 222, 128, 0.16); color: #86efac; }
    .feedback.bad .fb-icon { background: rgba(251, 113, 133, 0.16); color: #fda4af; }
    .feedback strong { display: block; margin-bottom: 3px; font-size: 13.5px; font-weight: 800; color: var(--text); }
    .feedback p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
    .feedback p b { color: var(--text); font-weight: 700; }
    .feedback .note { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255, 255, 255, 0.14); color: #fcd34d; font-size: 11.5px; }

    .q-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 24px; }
    .hint { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 10.5px; line-height: 1.5; }
    kbd {
      display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 4px;
      border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px;
      background: rgba(255, 255, 255, 0.04); color: var(--muted); font-family: inherit; font-size: 9.5px; font-weight: 700;
    }

    /* ---------- Result ---------- */
    .result-card {
      padding: clamp(22px, 4vw, 38px); border: 1px solid var(--border); border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.022));
      box-shadow: var(--shadow);
    }
    .result-hero { text-align: center; }
    .ring { position: relative; width: 172px; height: 172px; margin: 4px auto 14px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.07); stroke-width: 10; }
    .ring-fill { fill: none; stroke: url(#ringGrad); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
    .ring-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
    .ring-center b { display: block; font-family: "Lora", Georgia, serif; font-size: 42px; font-weight: 600; line-height: 1; letter-spacing: -0.04em; }
    .ring-center span { display: block; margin-top: 6px; color: var(--muted); font-size: 9.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
    .result-title { margin: 8px 0 7px; font-family: "Lora", Georgia, serif; font-size: clamp(26px, 4vw, 34px); font-weight: 600; letter-spacing: -0.03em; }
    .result-sub { max-width: 520px; margin: 0 auto; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
    .result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 28px 0; }
    .stat { padding: 15px 12px; border: 1px solid var(--border); border-radius: 15px; background: rgba(255, 255, 255, 0.03); text-align: center; }
    .stat b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .stat span { display: block; margin-top: 3px; color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .stat.good b { color: var(--green); }
    .stat.bad b { color: var(--red); }
    .stat.rate b { color: var(--teal); }

function icon(name, size = 18) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ESC_MAP[ch]);
}

/* Escape text but keep the <u>…</u> marks used by the pronunciation questions. */
function rich(value) {
  return esc(value)
    .replace(/&lt;u&gt;/g, "<u>")
    .replace(/&lt;\/u&gt;/g, "</u>");
}

const ALL_QUESTIONS = SECTIONS.flatMap((section) =>
  section.questions.map((q) => ({ ...q, section }))
);
const TOTAL = ALL_QUESTIONS.length;

const DEFAULT_PREFS = { shuffleOptions: true, shuffleQuestions: false, randomLimit: 0 };
let prefs = { ...DEFAULT_PREFS };
try {
  const raw = localStorage.getItem("en12-quiz-prefs-v1");
  if (raw) prefs = { ...prefs, ...JSON.parse(raw) };
} catch (error) { /* localStorage có thể bị chặn khi mở file trực tiếp */ }

function savePrefs() {
  try {
    localStorage.setItem("en12-quiz-prefs-v1", JSON.stringify(prefs));
  } catch (error) { /* bỏ qua */ }
}

const state = {
  view: "home",
  mode: null,
  sectionId: null,
  list: [],
  index: 0,
  selected: null,
  checked: false,
  answers: [],
  randomLimit: [0, 20, 40].includes(prefs.randomLimit) ? prefs.randomLimit : 0,
  reviewFilter: "all"
};

const app = document.getElementById("app");
const exitModal = document.getElementById("exit-modal");

function shuffle(items) {
  for (let i = items.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

function makeList(section, isRandom) {
  let pool;
  if (isRandom) {
    pool = ALL_QUESTIONS.map((q) => ({ ...q }));
    shuffle(pool);
    if (state.randomLimit > 0) pool = pool.slice(0, Math.min(state.randomLimit, pool.length));
  } else {
    pool = section.questions.map((q) => ({ ...q, section }));
    if (prefs.shuffleQuestions) shuffle(pool);
  }

  return pool.map((q) => {
    const order = q.o.map((_, i) => i);
    if (isRandom || prefs.shuffleOptions) shuffle(order);
    return {
      text: q.q,
      opts: order.map((i) => q.o[i]),
      answer: order.indexOf(q.a),
      note: q.note || "",
      section: q.section
    };
  });
}

function resetRound() {
  state.index = 0;
  state.selected = null;
  state.checked = false;
  state.answers = [];
  state.reviewFilter = "all";
}

function startSection(id) {
  const section = SECTIONS.find((s) => s.id === id);
  if (!section) return;
  state.mode = "section";
  state.sectionId = id;
  state.list = makeList(section, false);
  resetRound();
  renderQuiz(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startRandom() {
  state.mode = "random";
  state.sectionId = null;
  state.list = makeList(null, true);
  resetRound();
  renderQuiz(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  closeExitModal();
  state.view = "home";
  state.mode = null;
  state.sectionId = null;
  state.list = [];
  state.index = 0;
  state.selected = null;
  state.checked = false;
  state.answers = [];
  state.reviewFilter = "all";
  renderHome();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function attemptHome() {
  if (state.view === "quiz" && state.answers.some(Boolean)) {
    openExitModal();
  } else {
    goHome();
  }
}

function openExitModal() {
  exitModal.hidden = false;
  document.body.style.overflow = "hidden";
  const stay = exitModal.querySelector(".modal [data-close-modal]");
  if (stay) stay.focus();
}

function closeExitModal() {
  exitModal.hidden = true;
  document.body.style.overflow = "";
}

/* ---------- Trang chủ ---------- */

    <span class="section-info">
      <span class="section-kicker">${esc(section.kicker)}</span>
      <span class="section-title">${esc(section.title)}</span>
      <span class="section-desc">${section.questions.length} câu · ${esc(section.desc)}</span>
    </span>
    <span class="section-go">${icon("arrowRight", 15)}</span>
  </button>`;
}

function switchHTML(key, label, on) {
  return `<button type="button" class="switch ${on ? "on" : ""}" data-action="toggle" data-key="${key}" role="switch" aria-checked="${on}">

  </button>`;
}

/* ---------- Làm bài ---------- */
function quizMeta() {
  if (state.mode === "random") {
    return { kicker: "Random mix · Unit 2 & 3", title: `Đề tổng hợp · ${state.list.length} câu` };
  }
  const section = SECTIONS.find((s) => s.id === state.sectionId);
  return { kicker: `${section.unit} · ${section.kicker}`, title: section.title };
}

function optionHTML(item, i) {
  const selected = state.selected === i;
  let cls = "option";
  let status = "";
  if (state.checked) {
    cls += " locked";
    if (i === item.answer) {
      cls += " correct";
      status = `<span class="opt-status" style="color:var(--green)">${icon("check", 18)}</span>`;
    } else if (selected) {
      cls += " wrong";
      status = `<span class="opt-status" style="color:var(--red)">${icon("x", 18)}</span>`;
    } else {
      cls += " dim";
    }
  } else if (selected) {
    cls += " selected";
  }
  return `<button type="button" class="${cls}" data-opt="${i}" aria-pressed="${selected}" aria-disabled="${state.checked}">
    <span class="letter">${LETTERS[i]}</span>
    <span class="opt-text">${rich(item.opts[i])}</span>
    ${status}
  </button>`;
}

function feedbackHTML(item) {
  if (!state.checked) return "";
  const ok = state.selected === item.answer;
  const right = `<b>${LETTERS[item.answer]}. ${rich(item.opts[item.answer])}</b>`;
  return `<div class="feedback ${ok ? "good" : "bad"}">
    <span class="fb-icon">${icon(ok ? "check" : "x", 16)}</span>
    <div>
      <strong>${ok ? "Chính xác!" : "Chưa đúng."}</strong>
      <p>${ok ? `Bạn đã chọn đúng đáp án ${right}.` : `Đáp án đúng là ${right}.`}</p>
      ${item.note ? `<p class="note">${esc(item.note)}</p>` : ""}
    </div>
  </div>`;
}

function renderQuiz(animate = true) {
  state.view = "quiz";
  const item = state.list[state.index];
  const meta = quizMeta();
  const answered = state.answers.filter(Boolean).length;
  const correct = state.answers.filter((a) => a && a.correct).length;
  const progress = state.list.length ? (answered / state.list.length) * 100 : 0;
  const last = state.index === state.list.length - 1;
  const sourceChip = state.mode === "random" ? `${item.section.unit} · ${item.section.title}` : meta.title;

  const action = state.checked
    ? `<button type="button" class="btn btn-primary" data-action="next">${last ? "Xem kết quả" : "Câu tiếp theo"} ${icon(last ? "trophy" : "arrowRight", 17)}</button>`
    : `<button type="button" class="btn btn-primary" data-action="check" ${state.selected === null ? "disabled" : ""}>Kiểm tra ${icon("check", 17)}</button>`;

  app.innerHTML = `
    <div class="quiz-shell">
      <div class="quiz-top">
        <button type="button" class="icon-btn" data-action="home" aria-label="Về menu">${icon("arrowLeft", 19)}</button>
        <div class="quiz-heading">
          <div class="quiz-eyebrow">${esc(meta.kicker)}</div>
          <h1>${esc(meta.title)}</h1>
        </div>
        <div class="score-pill">${icon("spark", 14)} <b>${correct}</b> đúng</div>
      </div>

      <div class="progress-wrap" aria-hidden="true">
        <div class="progress-fill" style="width:${progress}%"></div>
      </div>

      <article class="q-card ${animate ? "animate" : ""}">
        <div class="q-meta">
          <span class="chip">Câu ${state.index + 1} / ${state.list.length}</span>
          <span class="chip ghost">${esc(sourceChip)}</span>
        </div>
        <p class="q-text">${esc(item.text)}</p>
        <div class="options">${item.opts.map((_, i) => optionHTML(item, i)).join("")}</div>
        ${feedbackHTML(item)}
        <div class="q-actions">
          <span class="hint"><kbd>A</kbd>–<kbd>D</kbd> để chọn · <kbd>Enter</kbd> để ${state.checked ? "tiếp tục" : "kiểm tra"}</span>
          ${action}
        </div>
      </article>
    </div>
  `;
}

/* ---------- Kết quả ---------- */
function getVerdict(pct) {
  if (pct >= 90) {
    return { title: "Xuất sắc!", sub: "Bạn nắm bài rất chắc. Thử đề tổng hợp để thách thức bản thân thêm nhé." };
  }
  if (pct >= 75) {
    return { title: "Rất tốt!", sub: "Chỉ còn vài lỗi nhỏ. Xem lại phần đáp án bên dưới để ghi nhớ lâu hơn." };
  }
  if (pct >= 50) {
    return { title: "Cố gắng thêm!", sub: "Bạn đã nắm được phần lớn nội dung. Ôn lại các câu sai rồi thử lại nhé." };
  }
  return { title: "Đừng nản!", sub: "Hãy xem lại đáp án và ghi chú các điểm ngữ pháp quan trọng, sau đó làm lại một lượt nữa." };
}

function reviewHTML() {
  const entries = state.list.map((item, i) => ({ item, i, ans: state.answers[i] }));
  const shown = entries.filter(({ ans }) => {
    if (state.reviewFilter === "correct") return Boolean(ans && ans.correct);
    if (state.reviewFilter === "wrong") return !ans || !ans.correct;
    return true;
  });

  if (!shown.length) {
    return `<div class="review-empty">Không có câu nào trong mục này.</div>`;
  }

  return shown.map(({ item, i, ans }) => {
    const ok = Boolean(ans && ans.correct);
    const tag = !ans ? "Chưa làm" : ok ? "Đúng" : "Sai";
    const your = ans
      ? `<b>${LETTERS[ans.selected]}. ${rich(item.opts[ans.selected])}</b>`
      : `<b>Chưa trả lời</b>`;
    const right = `<b>${LETTERS[item.answer]}. ${rich(item.opts[item.answer])}</b>`;
    return `<details class="review-item">
      <summary>
        <span class="status-dot ${ok ? "ok" : "no"}">${icon(ok ? "check" : "x", 13)}</span>
        <span class="review-index">Câu ${i + 1}</span>
        <span class="review-q">${esc(item.text)}</span>
        <span class="review-tag ${ok ? "ok" : "no"}">${tag}</span>
      </summary>
      <div class="review-body">
        <p><span>Bạn chọn</span> ${your}</p>
        <p><span>Đáp án</span> ${right}</p>
        ${item.note ? `<p class="review-note">${esc(item.note)}</p>` : ""}
      </div>
    </details>`;
  }).join("");
}

function renderResult() {
  state.view = "result";
  const total = state.list.length;
  const correct = state.answers.filter((a) => a && a.correct).length;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const verdict = getVerdict(pct);
  const circumference = 2 * Math.PI * 70;
  const offset = circumference - (circumference * pct) / 100;
  const ringColors = pct >= 75 ? ["#8b9cff", "#57e0c4"] : pct >= 50 ? ["#ffd479", "#57e0c4"] : ["#ff8f8f", "#ffd479"];
  const meta = state.mode === "random" ? "Tổng hợp ngẫu nhiên" : (SECTIONS.find((s) => s.id === state.sectionId) || {}).title || "Kết quả";

  app.innerHTML = `
    <div class="quiz-shell">
      <div class="quiz-top">
        <button type="button" class="icon-btn" data-action="home" aria-label="Về menu">${icon("arrowLeft", 19)}</button>
        <div class="quiz-heading">
          <div class="quiz-eyebrow">Kết quả · ${esc(meta)}</div>
          <h1>${state.mode === "random" ? `Đề tổng hợp · ${total} câu` : esc(meta)}</h1>
        </div>
        <div class="score-pill">${icon("trophy", 14)} <b>${correct}</b> / ${total}</div>
      </div>

      <div class="result-card">
        <div class="result-hero">
          <div class="ring">
            <svg viewBox="0 0 170 170" aria-hidden="true">
              <defs>
                <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="${ringColors[0]}" />
                  <stop offset="100%" stop-color="${ringColors[1]}" />
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="85" cy="85" r="70" />
              <circle class="ring-fill" cx="85" cy="85" r="70" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" />
            </svg>
            <div class="ring-center">
              <div><b>${pct}%</b><span>Tỉ lệ đúng</span></div>
            </div>
          </div>
          <h2 class="result-title">${verdict.title}</h2>
          <p class="result-sub">${verdict.sub}</p>

          <div class="result-stats">
            <div class="stat good"><b>${correct}</b><span>Câu đúng</span></div>
            <div class="stat bad"><b>${total - correct}</b><span>Câu sai</span></div>
            <div class="stat rate"><b>${correct}/${total}</b><span>Điểm số</span></div>
          </div>

          <div class="result-actions">
            <button type="button" class="btn btn-primary" data-action="restart">${icon("refresh", 16)} Làm lại</button>
            <button type="button" class="btn btn-ghost" data-action="random-again">${icon("shuffle", 16)} ${state.mode === "random" ? "Đề khác" : "Đề tổng hợp"}</button>
            <button type="button" class="btn btn-ghost" data-action="home">${icon("home", 16)} Về menu</button>
          </div>
        </div>

        <div class="review-head">
          <div>
            <h2>Xem lại đáp án</h2>
            <span class="review-count">${correct} đúng · ${total - correct} sai</span>
          </div>
          <div class="review-filters" role="group" aria-label="Lọc câu hỏi">
            <button type="button" data-action="filter" data-filter="all" class="${state.reviewFilter === "all" ? "active" : ""}">Tất cả</button>
            <button type="button" data-action="filter" data-filter="wrong" class="${state.reviewFilter === "wrong" ? "active" : ""}">Câu sai (${total - correct})</button>
            <button type="button" data-action="filter" data-filter="correct" class="${state.reviewFilter === "correct" ? "active" : ""}">Câu đúng (${correct})</button>
          </div>
        </div>

        <div class="review-list">${reviewHTML()}</div>
      </div>
    </div>
  `;
}

/* ---------- Tương tác ---------- */
function selectOption(i) {
  const item = state.list[state.index];
  if (!item || state.checked || i < 0 || i >= item.opts.length) return;
  state.selected = i;
  app.querySelectorAll("[data-opt]").forEach((el, idx) => {
    el.classList.toggle("selected", idx === i);
    el.setAttribute("aria-pressed", String(idx === i));
  });
  const checkBtn = app.querySelector('[data-action="check"]');
  if (checkBtn) checkBtn.disabled = false;
}

function checkAnswer() {
  if (state.selected === null || state.checked) return;
  const item = state.list[state.index];
  state.checked = true;
  state.answers[state.index] = { selected: state.selected, correct: state.selected === item.answer };
  renderQuiz(false);
  requestAnimationFrame(() => {
    const feedback = app.querySelector(".feedback");
    if (feedback) feedback.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
}

function nextQuestion() {
  if (!state.checked) return;
  if (state.index >= state.list.length - 1) {
    renderResult();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  state.index += 1;
  state.selected = null;
  state.checked = false;
  renderQuiz(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function restartRound() {
  if (state.mode === "random") {
    startRandom();
  } else if (state.sectionId) {
    startSection(state.sectionId);
  } else {
    goHome();
  }
}

app.addEventListener("click", (event) => {
  const option = event.target.closest("[data-opt]");
  if (option && state.view === "quiz" && !state.checked) {
    selectOption(Number(option.dataset.opt));
    return;
  }

  const target = event.target.closest("[data-action]");
  if (!target) return;

  switch (target.dataset.action) {
    case "start-section":
      startSection(target.dataset.id);
      break;
    case "start-random":
      startRandom();
      break;
    case "set-limit":
      state.randomLimit = Number(target.dataset.limit);
      prefs.randomLimit = state.randomLimit;
      savePrefs();
      renderHome();
      break;
    case "toggle": {
      const key = target.dataset.key;
      if (key === "shuffleOptions" || key === "shuffleQuestions") {
        prefs[key] = !prefs[key];
        savePrefs();
        renderHome();
      }
      break;
    }
    case "check":
      checkAnswer();
      break;
    case "next":
      nextQuestion();
      break;
    case "home":
      attemptHome();
      break;
    case "restart":
      restartRound();
      break;
    case "random-again":
      startRandom();
      break;
    case "filter":
      state.reviewFilter = target.dataset.filter;
      renderResult();
      break;
    default:
      break;
  }
});

document.addEventListener("keydown", (event) => {
  if (!exitModal.hidden) {
    if (event.key === "Escape") {
      event.preventDefault();
      closeExitModal();
    }
    return;
  }
  if (state.view !== "quiz") return;
  if (event.ctrlKey || event.metaKey || event.altKey) return;

  const tag = (event.target.tagName || "").toLowerCase();
  if (["input", "textarea", "select"].includes(tag)) return;

  const key = event.key.toLowerCase();
  const byLetter = ["a", "b", "c", "d"].indexOf(key);
  const byNumber = ["1", "2", "3", "4"].indexOf(key);
  const target = byLetter >= 0 ? byLetter : byNumber;

  if (target >= 0) {
    if (!state.checked) {
      event.preventDefault();
      selectOption(target);
    }
    return;
  }

  if (key === "enter") {
    event.preventDefault();
    if (state.checked) nextQuestion();
    else if (state.selected !== null) checkAnswer();
    return;
  }

  if (event.key === "Escape") {
    event.preventDefault();
    attemptHome();
  }
});

exitModal.addEventListener("click", (event) => {
  if (event.target.closest("[data-confirm-exit]")) {
    closeExitModal();
    goHome();
    return;
  }
  if (event.target.closest("[data-close-modal]")) {
    closeExitModal();
  }
});

renderHome();


  </script>
</body>
</html>
