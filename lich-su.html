<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đề cương ôn tập Lịch sử 11 – Giữa học kì I</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #0c150e;
        --bg-2: #1c130a;
        --bg-3: #0b131e;
        --panel: rgba(239, 246, 255, 0.045);
        --panel-strong: rgba(239, 246, 255, 0.07);
        --panel-border: rgba(239, 246, 255, 0.1);
        --gold: #3b82f6;
        --gold-bright: #60a5fa;
        --leaf: #1d4ed8;
        --leaf-bright: #3b82f6;
        --rust: #0f172a;
        --rust-bright: #a19a79;
        --cream: #eff6ff;
        --muted: #64748b;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 16.5px;
        background:
          radial-gradient(
            60% 50% at 15% 0%,
            rgba(59, 130, 246, 0.1),
            transparent 60%
          ),
          radial-gradient(
            55% 45% at 100% 100%,
            rgba(29, 78, 216, 0.14),
            transparent 60%
          ),
          linear-gradient(
            155deg,
            var(--bg-2) 0%,
            var(--bg-1) 55%,
            var(--bg-3) 100%
          );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--cream);
      }
      .font-display {
        font-family: "Fraunces", serif;
        font-optical-sizing: auto;
      }
      .glass {
        background: var(--panel);
        backdrop-filter: blur(18px);
        border: 1px solid var(--panel-border);
      }
      .glass-card {
        background: var(--panel-strong);
        backdrop-filter: blur(22px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
        transition:
          box-shadow 0.4s ease,
          transform 0.4s ease;
      }
      .opt-btn {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: 1px solid var(--panel-border);
        background: rgba(230, 224, 200, 0.03);
      }
      .opt-btn:hover {
        transform: translateX(5px);
        background: rgba(207, 158, 63, 0.08);
        border-color: rgba(207, 158, 63, 0.35);
      }
      .opt-btn.selected {
        background: linear-gradient(135deg, var(--gold), #b3822d) !important;
        border-color: var(--gold-bright) !important;
        color: #20140a !important;
        transform: translateX(5px);
        box-shadow: 0 6px 22px -6px rgba(207, 158, 63, 0.5);
      }
      .opt-btn.correct {
        background: linear-gradient(135deg, var(--leaf), #3f7a2a) !important;
        border-color: var(--leaf-bright) !important;
        color: #0d1a08 !important;
        box-shadow: 0 6px 22px -6px rgba(95, 154, 68, 0.5);
      }
      .opt-btn.wrong {
        background: linear-gradient(135deg, var(--rust), #8f3a26) !important;
        border-color: var(--rust-bright) !important;
        color: #fff !important;
        box-shadow: 0 6px 22px -6px rgba(182, 83, 58, 0.5);
      }
      .opt-btn.disabled {
        opacity: 0.65;
        cursor: default;
        transform: none !important;
      }
      .opt-badge {
        transition: all 0.25s ease;
      }
      .tf-btn {
        transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        min-width: 84px;
        text-align: center;
        border: 1px solid var(--panel-border);
        background: rgba(230, 224, 200, 0.04);
      }
      .tf-btn:hover {
        transform: scale(1.04);
      }
      .tf-btn.selected-true {
        background: linear-gradient(135deg, var(--leaf), #3f7a2a) !important;
        border-color: var(--leaf-bright) !important;
        color: #0d1a08 !important;
        box-shadow: 0 5px 16px -4px rgba(95, 154, 68, 0.5);
      }
      .tf-btn.selected-false {
        background: linear-gradient(135deg, var(--rust), #8f3a26) !important;
        border-color: var(--rust-bright) !important;
        color: #fff !important;
        box-shadow: 0 5px 16px -4px rgba(182, 83, 58, 0.5);
      }
      .tf-btn.reveal-true {
        background: linear-gradient(135deg, var(--leaf), #3f7a2a) !important;
        border-color: var(--leaf-bright) !important;
        color: #0d1a08 !important;
      }
      .tf-btn.reveal-false {
        background: linear-gradient(135deg, var(--rust), #8f3a26) !important;
        border-color: var(--rust-bright) !important;
        color: #fff !important;
      }
      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-in {
        animation: fadeSlideUp 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fadeIn 0.35s ease forwards;
      }
      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 0 rgba(207, 158, 63, 0);
        }
        50% {
          box-shadow: 0 0 26px rgba(207, 158, 63, 0.28);
        }
      }
      .glow {
        animation: glow 2.8s ease-in-out infinite;
      }
      @keyframes sway {
        0%,
        100% {
          transform: translateX(-50%) rotate(-3deg);
        }
        50% {
          transform: translateX(-50%) rotate(3deg);
        }
      }
      .sway {
        animation: sway 3.2s ease-in-out infinite;
        transform-origin: bottom center;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(230, 224, 200, 0.03);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(230, 224, 200, 0.12);
        border-radius: 3px;
      }
      textarea:focus {
        outline: none;
        box-shadow: 0 0 0 2px var(--gold);
        border-color: var(--gold) !important;
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--gold-bright);
      }
      .circle-bg {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.14;
        pointer-events: none;
        z-index: 0;
      }
      /* ---- bộ chọn phần / đảo thứ tự ---- */
      .mode-btn {
        transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: 1px solid var(--panel-border);
        background: rgba(230, 224, 200, 0.04);
        color: var(--cream);
        white-space: nowrap;
      }
      .mode-btn:hover {
        background: rgba(207, 158, 63, 0.1);
        border-color: rgba(207, 158, 63, 0.35);
      }
      .mode-btn.active {
        background: linear-gradient(135deg, var(--gold), #b3822d);
        border-color: var(--gold-bright);
        color: #20140a;
        box-shadow: 0 5px 16px -5px rgba(207, 158, 63, 0.45);
      }
      /* ---- tư liệu / đoạn dẫn ---- */
      .passage {
        background: rgba(230, 224, 200, 0.035);
        border: 1px solid rgba(230, 224, 200, 0.08);
        border-left: 3px solid var(--gold);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 15px;
        line-height: 1.8;
        color: var(--cream);
        opacity: 0.92;
        white-space: pre-wrap;
        margin-bottom: 1rem;
      }
      .passage .src {
        display: block;
        margin-top: 10px;
        font-size: 12.5px;
        font-style: italic;
        color: var(--muted);
      }
      .ptbl {
        width: 100%;
        border-collapse: collapse;
        margin: 2px 0 4px;
        font-size: 14px;
        white-space: normal;
      }
      .ptbl th,
      .ptbl td {
        border: 1px solid rgba(230, 224, 200, 0.12);
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
        line-height: 1.7;
      }
      .ptbl th {
        background: rgba(230, 224, 200, 0.06);
        font-weight: 600;
        color: var(--gold-bright);
        white-space: nowrap;
      }
    </style>
  </head>
  <body class="p-4">
    <div
      class="circle-bg w-[420px] h-[420px] top-[-110px] left-[-110px]"
      style="background: var(--gold)"
    ></div>
    <div
      class="circle-bg w-[320px] h-[320px] bottom-[-60px] right-[-60px]"
      style="background: var(--leaf)"
    ></div>

    <div class="w-full max-w-2xl mx-auto relative z-10">
      <div class="glass rounded-2xl px-6 py-5 mb-5">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="var(--gold-bright)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
            <span
              class="font-display text-lg tracking-wide"
              style="color: var(--cream)"
              >Lịch sử 11</span
            >
          </div>
          <p
            class="text-xs font-semibold tracking-wide"
            style="color: var(--muted)"
            id="progress-text"
          >
            0 / 0
          </p>
        </div>
        <div class="relative mx-3" style="height: 24px">
          <div
            class="w-full h-[6px] rounded-full overflow-hidden absolute top-1/2"
            style="
              transform: translateY(-50%);
              background: rgba(230, 224, 200, 0.08);
            "
          >
            <div
              class="h-full rounded-full"
              id="progress-bar"
              style="
                width: 0%;
                background: linear-gradient(90deg, var(--leaf), var(--gold));
                transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
              "
            ></div>
          </div>
          <div
            class="absolute top-1/2"
            id="progress-leaf"
            style="
              left: 0%;
              transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
              transform: translate(-50%, -50%);
            "
          >
            <div
              class="w-6 h-6 rounded-full flex items-center justify-center"
              style="
                background: radial-gradient(
                  circle at 32% 28%,
                  var(--gold-bright),
                  var(--gold)
                );
                box-shadow: 0 3px 10px -2px rgba(207, 158, 63, 0.6);
              "
            >
              <svg
                viewBox="0 0 24 24"
                width="13"
                height="13"
                fill="none"
                stroke="#20140a"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="16 18 22 12 16 6" />
                <polyline points="8 6 2 12 8 18" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="glass rounded-2xl px-4 py-3 mb-5">
        <div
          class="flex flex-col sm:flex-row sm:items-center gap-3 justify-between"
        >
          <div class="flex gap-2 flex-wrap" id="mode-bar">
            <button
              class="mode-btn px-4 py-2 rounded-xl text-sm font-semibold"
              data-mode="mcq"
              onclick="setMode('mcq')"
            >
              Trắc nghiệm
              <span id="cnt-mcq" class="opacity-60"></span>
            </button>
            <button
              class="mode-btn px-4 py-2 rounded-xl text-sm font-semibold"
              data-mode="tf"
              onclick="setMode('tf')"
            >
              Đúng / Sai
              <span id="cnt-tf" class="opacity-60"></span>
            </button>
            <button
              class="mode-btn px-4 py-2 rounded-xl text-sm font-semibold"
              data-mode="all"
              onclick="setMode('all')"
            >
              Tất cả
              <span id="cnt-all" class="opacity-60"></span>
            </button>
          </div>
          <label
            class="flex items-center gap-2 text-sm cursor-pointer select-none"
            style="color: var(--muted)"
          >
            <input
              type="checkbox"
              id="shuffle-toggle"
              onchange="setShuffle(this.checked)"
              style="
                accent-color: #60a5fa;
                width: 16px;
                height: 16px;
                cursor: pointer;
              "
            />
            <span>Đảo thứ tự ngẫu nhiên</span>
          </label>
        </div>
      </div>

      <div
        id="question-area"
        class="glass-card rounded-[26px] p-6 sm:p-7 min-h-[280px] animate-in relative"
      >
        <div id="question-content"></div>
        <div id="feedback-area" class="mt-5 hidden"></div>
        <div id="btn-area" class="mt-6 flex justify-end gap-3"></div>
      </div>
    </div>

    <script>
      const ICON = {
        check: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
        x: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
        alert: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>`,
        arrow: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
        refresh: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>`,
        chart: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M8 17V10M13 17V6M18 17v-4"/></svg>`,
        edit: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
        sprout: `<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="var(--leaf-bright)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>`,
      };
      const LETTERS = ["A", "B", "C", "D", "E", "F"];

      const QUESTIONS = [
        /* ================= I. TRẮC NGHIỆM – BÀI 1 ================= */
        {
          type: "mcq",
          part: "I. Trắc nghiệm – Bài 1",
          q: "Câu 1. Ở Anh, vào cuối thế kỉ XV - đầu thế kỉ XVI, sự xâm nhập của phương thức sản xuất tư bản chủ nghĩa vào nông nghiệp được biểu hiện rõ nét thông qua phong trào nào sau đây?",
          opts: [
            "A. “Phát triển ngoại thương”.",
            "B. “Phát kiến địa lí”.",
            "C. “Rào đất cướp ruộng”.",
            "D. “Cách mạng Xanh”.",
          ],
          ans: 2,
        },
        {
          type: "mcq",
          part: "I. Trắc nghiệm – Bài 1",
          q: "Câu 2. Lực lượng nào thuộc Đẳng cấp thứ nhất trong xã hội Pháp trước cách mạng (cuối thế kỉ XVIII)?",
          opts: [
            "A. Giai cấp tư sản.",
            "B. Nông dân.",
            "C. Tăng lữ Giáo hội.",
            "D. Bình dân thành thị.",
          ],
          ans: 2,
        },
        {
          type: "mcq",
          part: "I. Trắc nghiệm – Bài 1",
          q: "Câu 3. Trong cuộc Cách mạng Nê-đéc-lan (thế kỉ XVI), giai cấp tư sản và quý tộc mới đã sử dụng tôn giáo nào làm “ngọn cờ” tư tưởng để tập hợp quần chúng nhân dân?",
          opts: [
            "A. Thanh giáo.",
            "B. Anh giáo.",
            "C. Đạo Tin lành.",
            "D. Thiên Chúa giáo.",
          ],
          ans: 2,
        },
        {
          type: "mcq",
          part: "I. Trắc nghiệm – Bài 1",
          q: "Câu 4. Ở Pháp, nền tảng của hệ tư tưởng dân chủ tư sản dọn đường cho cách mạng bùng nổ là",
          opts: [
            "A. Cải cách tôn giáo.",
            "B. Văn hóa Phục hưng.",

            "D. Thuyết Kinh tế học cổ điển.",
          ],
          ans: 2,
        },
        {
          type: "mcq",
          part: "I. Trắc nghiệm – Bài 1",
          q: "Câu 5. Các cuộc cách mạng tư sản thời cận đại đều hướng tới mục tiêu chung là xóa bỏ những trở ngại trên con đường xác lập và phát triển của",
          opts: [
            "A. chủ nghĩa tư bản.",
            "B. chế độ phong kiến.",
            "C. chủ nghĩa xã hội.",
            "D. chế độ chiếm hữu nô lệ.",
          ],
          ans: 0,
        },
        {
          type: "mcq",
          part: "I. Trắc nghiệm – Bài 1",
          q: "Câu 6. Cuộc cách mạng tư sản nào dưới đây do giai cấp tư sản và quý tộc mới lãnh đạo?",
          opts: [
            "A. Cách mạng tư sản Pháp (thế kỉ XVIII).",
            "B. Cách mạng tư sản Anh (thế kỉ XVII).",
            "C. Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mỹ.",

          ans: 1,

        {

            "A. Ô. Crôm-oen.",

          ans: 0,
        },
        {
          type: "mcq",

          opts: ["A. Anh.", "B. Pháp.", "C. Mỹ.", "D. Đức."],
          ans: 2,
        },
        {
          type: "mcq",

          q: "Câu 9. Khẩu hiệu nổi tiếng “Tự do - Bình đẳng - Bác ái” có nguồn gốc từ cuộc cách mạng nào?",
          opts: [
            "A. Cách mạng tư sản Anh.",
            "B. Cách mạng tư sản Pháp.",
            "C. Chiến tranh giành độc lập ở Bắc Mỹ.",
            "D. Cách mạng Nê-đéc-lan.",
          ],
          ans: 1,
        },
        {
          type: "mcq",
          part: "I. Trắc nghiệm – Bài 1",
          q: "Câu 10. Một trong những kết quả mà các cuộc cách mạng tư sản nổ ra và giành thắng lợi từ giữa thế kỉ XVI đến đầu thế kỉ XX là gì?",
          opts: [
            "A. Đưa giai cấp công nhân lên nắm chính quyền.",
            "B. Lật đổ nền quân chủ chuyên chế.",
            "C. Xác lập sự thống trị của chủ nghĩa thực dân.",

          ],
          ans: 1,
        },
        {
          type: "mcq",
          part: "I. Trắc nghiệm – Bài 1",
          q: "Câu 11. Mục tiêu đấu tranh của các cuộc cách mạng tư sản từ giữa thế kỉ XVI đến đầu thế kỉ XX có điểm chung là",
          opts: [
            "A. mở đường cho chủ nghĩa tư bản phát triển.",

        <h2 class="font-display text-3xl font-semibold" style="color:var(--cream)">Hoàn thành!</h2>
        <p class="mt-2" style="color:var(--muted)">${title}</p>
        <div class="grid ${cols} gap-4 mt-8">${cards}
        </div>
      </div>`;
        fbArea.classList.add("hidden");
        btnArea.innerHTML = `<button onclick="restart()" class="px-8 py-3 rounded-xl font-semibold transition-all duration-300 glow flex items-center gap-2" style="background:linear-gradient(135deg,var(--gold),#b3822d); color:#20140a;">Làm lại ${ICON.refresh}</button>`;
        updateProgress(100);
        retriggerAnim();
      }
      function restart() {
        order = buildOrder();
        current = 0;
        confirmado = false;
        results = [];
        updateModeBar();
        render();
      }
      updateModeBar();
      restart();
    </script>
  </body>
</html>
